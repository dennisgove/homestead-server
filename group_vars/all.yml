# Homestead server settings. Edit the CHANGE-ME values before the first run.
# Secrets (passwords, keys) live in secrets.yml, not here; see secrets.example.yml.

homestead_hostname: homestead
offline: false                       # rebuild with no internet: ./bootstrap.sh -e offline=true
timezone: America/New_York            # CHANGE-ME: `timedatectl list-timezones`
region_state: Massachusetts              # e.g. "Tennessee"; drives maps + extension-service docs

admin_user: dennis
kiosk_user: guest

# --- Paths ---------------------------------------------------------------
repo_dir: /opt/homestead/repo        # bootstrap.sh copies this repo here
homestead_dir: /opt/homestead
homestead_data: /opt/homestead/data
state_dir: /var/lib/homestead
core_dir: /srv/core                  # NVMe: essentials library (always available)
portal_dir: /srv/portal
library_label: LIBRARY               # external 5TB USB HDD, ext4
library_mount: /srv/library
library_temp_size: 180G              # internal stand-in when no LIBRARY drive is attached ('0' = off);
                                     # move it to the drive later with homestead-library-migrate
nomad_dir: /opt/project-nomad
nomad_storage: /opt/project-nomad/storage   # bind mount of {{ library_mount }}/nomad
vault_lv: /dev/vg_sys/lv_vault
vault_mapper: homestead-vault
vault_mount: /srv/vault

# --- Network -------------------------------------------------------------
wifi_iface: auto                     # auto-detected; or set e.g. wlp2s0
hotspot_con: homestead-hotspot
hotspot_ssid: HOMESTEAD-LIBRARY
hotspot_ip: 10.42.0.1
hotspot_channel: 6
lan_name: library.lan

# Ports. Backends listen on the host but are firewalled from everything except
# Caddy. Public faces are Caddy ports 80 and 7000-7099.
ports:
  nomad: 8080
  kiwix: 8090
  kolibri: 8310
  flatnotes: 8200
  cyberchef: 8100        # NOMAD "Data Tools"
  stirling_pdf: 8400
  filebrowser: 8410
  it_tools: 8430
  excalidraw: 8440
  meshtastic_web: 8450
  translate: 8460        # NOMAD "Translated Library"
  homebox: 8470
  vaultwarden: 8480      # serves HTTPS itself (self-signed)
  calibreweb: 8420
  jellyfin: 8490
  meshcore_web: 8500     # serves HTTPS itself (self-signed)
  dozzle: 9999
  kiwix_core: 8601
  open_webui: 8610
  grocy: 8620
  mealie: 8630
  paperless: 8640
  pat: 8650
  openwebrx: 8660
  ollama: 11435

public_ports:
  nomad_readonly: 7000
  library: 7001
  core_library: 7002
  education: 7004
  books: 7005
  videos: 7006
  ai: 7007
  pantry: 7008
  recipes: 7009
  notes: 7010
  data_tools: 7011
  pdf_tools: 7012
  it_tools: 7013
  whiteboard: 7014
  inventory: 7015
  passwords: 7016        # HTTPS (Vaultwarden)
  mesh: 7017             # HTTPS (MeshCore Web)
  meshtastic: 7018       # HTTPS (Meshtastic Web; Web Serial/Bluetooth need it)
  translated_library: 7019
  sdr: 7020              # OpenWebRX+ (its settings pages need the admin password)
  admin_nomad: 7090
  admin_pat: 7091
  admin_paperless: 7092
  admin_logs: 7093
  admin_files: 7094      # File Browser can delete library files, so admin only

# Plain-HTTP copies of the radio web apps, on 127.0.0.1 only, for the server's
# own screen: browsers treat http://localhost as secure, so Web Serial works
# without a certificate warning (Chrome only forgets that warning on restart).
local_ports:
  meshcore: 7027
  meshtastic: 7028

# NOMAD's own links to its apps point at their backend ports, which the
# firewall blocks. homestead-nomad-links sets each installed app's custom URL
# to its public port instead (at every playbook run and every 5 minutes, so
# apps installed later from the Supply Depot get fixed too).
# service name: [public_ports key, scheme]
nomad_links:
  nomad_kiwix_server: [library, http]
  nomad_kolibri: [education, http]
  nomad_kolibri_2: [education, http]
  nomad_calibreweb: [books, http]
  nomad_jellyfin: [videos, http]
  nomad_flatnotes: [notes, http]
  nomad_cyberchef: [data_tools, http]
  nomad_stirling_pdf: [pdf_tools, http]
  nomad_it_tools: [it_tools, http]
  nomad_excalidraw: [whiteboard, http]
  nomad_homebox: [inventory, http]
  nomad_vaultwarden: [passwords, https]
  nomad_meshcore_web: [mesh, https]
  nomad_meshtastic_web: [meshtastic, https]
  nomad_translate: [translated_library, http]
  nomad_filebrowser: [admin_files, http]
  # NOMAD's own AI chat unloads the models Open WebUI is using; send its tile to Open WebUI instead.
  nomad_ollama: [ai, http]
nomad_links_host: "{{ homestead_hostname }}.local"

# --- Container images ---------------------------------------------------
# Pin to the versions that worked on first install; `homestead-export-offline`
# saves them to the backup drive so a rebuild needs no internet.
images:
  ollama: ollama/ollama:0.33.3
  open_webui: ghcr.io/open-webui/open-webui:main
  kiwix: ghcr.io/kiwix/kiwix-serve:3.8.1
  grocy: lscr.io/linuxserver/grocy:latest
  mealie: ghcr.io/mealie-recipes/mealie:latest
  paperless: ghcr.io/paperless-ngx/paperless-ngx:latest
  redis: redis:7-alpine
  openwebrx: slechev/openwebrxplus:1.2.126

# --- Web SDR (OpenWebRX+) -------------------------------------------------
# Location shown on its map (ADS-B, APRS). Rough is fine; CHANGE-ME to your town.
sdr_gps: { lat: 42.3, lon: -71.8 }

# --- AI ------------------------------------------------------------------
# CPU-only (i7-8700T, 32GB). Revisit names at install time for newer releases
# in the same size classes.
# Non-thinking models answer straight away; on this CPU a thinking model spends
# minutes reasoning first, so it's a separate pick for hard planning questions.
ai_models:
  planner: qwen3:30b-instruct        # Qwen3-30B-A3B-Instruct-2507: MoE 30B / 3B active, ~19GB RAM
  thinker: qwen3:30b-thinking        # Thinking-2507 version of the same model, ~19GB RAM
  fast: qwen3:4b-instruct            # titles and search rewrites for Open WebUI
  vision: gemma3:4b
  embed: nomic-embed-text
ai_context: 8192
# Chat model + the fast task model + the small embedding model stay loaded together,
# so titles and knowledge-base indexing don't evict the chat model mid-answer
# (reloading it means reading 19GB from disk). ~22GB together.
ai_max_loaded_models: 3
ai_keep_alive: 30m
ai_personas:
  - { name: homestead-planner, base: "{{ ai_models.planner }}", temperature: 0.4 }
  - { name: homestead-thinker, base: "{{ ai_models.thinker }}", temperature: 0.6 }

# --- Power (Victron VE.Direct) ------------------------------------------
power_eco_soc: 35                    # % : stop AI + video
power_resume_soc: 45                 # % : resume (hysteresis)
power_shutdown_soc: 15               # % : clean shutdown
power_eco_volts: 12.9                # fallback for MPPT-only (no SOC), LiFePO4 12V
power_shutdown_volts: 12.4

# --- Backup --------------------------------------------------------------
backup_labels: [BACKUP-A, BACKUP-B]
backup_mount_root: /mnt/backup
borg_keep_daily: 7
borg_keep_weekly: 8
borg_keep_monthly: 12
