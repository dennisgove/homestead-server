- name: restart website
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [homestead-site.service, homestead-manager.service]

- name: start index
  ansible.builtin.command: systemctl start --no-block homestead-index.service
  changed_when: true

- name: reload caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: reloaded

- name: reload firewall
  ansible.builtin.systemd_service:
    name: homestead-firewall
    state: restarted
    daemon_reload: true
