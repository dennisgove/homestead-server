# The Hub (hub/ in this repo): the portal, maps, binder, status page, the
# Library manager and the API. Runs unprivileged; the library jobs it starts run
# as their own systemd units (roles/content).

- name: Hub dependencies (from Ubuntu, so the offline kit has them)
  ansible.builtin.apt:
    name: [python3-fastapi, python3-uvicorn, python3-jinja2, python3-yaml, python3-multipart, sqlite3]
    update_cache: "{{ not offline }}"

- name: Hub user
  ansible.builtin.user:
    name: homestead-hub
    system: true
    shell: /usr/sbin/nologin
    home: "{{ state_dir }}/hub"
    create_home: false

- name: Hub code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/hub/homestead"
    dest: "{{ hub_dir }}/"
    mode: preserve
  notify: restart hub

- name: Catalog baseline
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/content/catalog.yaml"
    dest: "{{ hub_dir }}/catalog.yaml"
    mode: "0644"

- name: Hub settings (has the admin header, so not world-readable)
  ansible.builtin.template:
    src: hub.json.j2
    dest: /etc/homestead/hub.json
    owner: root
    group: homestead-hub
    mode: "0640"
  notify: restart hub

- name: Hub state (catalog edits, download queue) belongs to the Hub
  ansible.builtin.file:
    path: "{{ state_dir }}/hub"
    state: directory
    owner: homestead-hub
    group: homestead-hub
    mode: "0750"

- name: Job status folder (jobs write, the Hub reads)
  ansible.builtin.file:
    path: "{{ state_dir }}/status"
    state: directory
    mode: "0755"

# Uploads from the Library manager land in the documents folders, so the Hub's
# group may write there (setgid keeps new files in the group).
- name: Document folders the Hub can add to
  ansible.builtin.file:
    path: "{{ core_dir }}/docs/{{ item }}"
    state: directory
    group: homestead-hub
    mode: "2775"
  loop: "{{ [''] + (lookup('file', playbook_dir ~ '/content/catalog.yaml') | from_yaml).categories.keys() | list }}"

- name: The Hub may start (only) the homestead-* jobs
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/60-homestead-hub.rules
    content: |
      // Managed by Ansible (roles/hub).
      polkit.addRule(function (action, subject) {
        if (action.id == "org.freedesktop.systemd1.manage-units" && subject.user == "homestead-hub") {
          var unit = action.lookup("unit") || "", verb = action.lookup("verb") || "";
          if (/^homestead-[a-z-]+\.service$/.test(unit) && verb == "start") return polkit.Result.YES;
        }
        return polkit.Result.NOT_HANDLED;
      });
    mode: "0644"

- name: Hub service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homestead-hub.service
    content: |
      [Unit]
      Description=Homestead Hub (portal, Library manager, API)
      After=network.target docker.service
      [Service]
      User=homestead-hub
      Group=homestead-hub
      Environment=PYTHONPATH={{ hub_dir }}
      Environment=HOMESTEAD_CONFIG=/etc/homestead/hub.json
      ExecStart=/usr/bin/python3 -m uvicorn homestead.web.app:app --host 0.0.0.0 --port {{ hub_port }} --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
      Restart=always
      RestartSec=3
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ReadWritePaths={{ state_dir }}/hub {{ core_dir }}/docs -{{ library_mount }}/books/incoming
      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: restart hub

- name: Hub running
  ansible.builtin.systemd_service:
    name: homestead-hub
    enabled: true
    state: started
    daemon_reload: true

- name: Hub answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ hub_port }}/api/apps"
  register: hub_up
  retries: 10
  delay: 3
  until: hub_up.status == 200
