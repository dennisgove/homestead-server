- name: Nftables dir
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Firewall rules
  ansible.builtin.template:
    src: homestead.nft.j2
    dest: /etc/nftables.d/homestead.nft
    mode: "0644"
    validate: nft -c -f %s
  notify: reload firewall

- name: Firewall unit (own table; does not flush Docker's rules)
  ansible.builtin.copy:
    dest: /etc/systemd/system/homestead-firewall.service
    content: |
      [Unit]
      Description=Homestead firewall
      Wants=network-pre.target
      Before=network-pre.target
      After=systemd-user-sessions.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/nftables.d/homestead.nft
      ExecReload=/usr/sbin/nft -f /etc/nftables.d/homestead.nft
      ExecStop=/usr/sbin/nft delete table inet homestead

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  notify: reload firewall

- name: Enable firewall
  ansible.builtin.systemd_service:
    name: homestead-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: Caddy config
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: reload caddy

- name: Caddy running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
