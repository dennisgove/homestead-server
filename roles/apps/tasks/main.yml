- name: App data directories
  ansible.builtin.file:
    path: "{{ homestead_data }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [ollama, open-webui, grocy, mealie, openwebrx/var, openwebrx/etc]

- name: OpenWebRX+ admin password (generated once; `sudo cat /etc/homestead/openwebrx-admin`)
  ansible.builtin.set_fact:
    openwebrx_admin_password: "{{ lookup('ansible.builtin.password', '/etc/homestead/openwebrx-admin', chars=['ascii_letters', 'digits'], length=20) }}"
  no_log: true

- name: OpenWebRX+ admin password file is root-only
  ansible.builtin.file:
    path: /etc/homestead/openwebrx-admin
    mode: "0600"

# Starting point only: after the first run these files belong to OpenWebRX+'s
# own settings pages, so they're never overwritten.
- name: OpenWebRX+ starting settings (receiver, band profiles)
  ansible.builtin.template:
    src: openwebrx-settings.json.j2
    dest: "{{ homestead_data }}/openwebrx/var/settings.json"
    mode: "0644"
    force: false

- name: OpenWebRX+ starting bookmarks (NOAA, calling channels)
  ansible.builtin.copy:
    src: openwebrx-bookmarks.json
    dest: "{{ homestead_data }}/openwebrx/var/bookmarks.json"
    mode: "0644"
    force: false

- name: Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ homestead_dir }}/compose.yaml"
    mode: "0644"
  register: compose

- name: Start add-on apps
  ansible.builtin.command: docker compose -f {{ homestead_dir }}/compose.yaml up -d --remove-orphans
  register: up
  changed_when: "'Started' in up.stderr or 'Recreated' in up.stderr or 'Created' in up.stderr"
