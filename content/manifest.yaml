docs:
  - { title: "Nuclear War Survival Skills (Kearny)", url: "https://www.oism.org/nwss/nwss.pdf", file: nuclear-war-survival-skills.pdf, cat: survival, tier: 1 }
  - { title: "Are You Ready? (FEMA citizen preparedness)", url: "https://www.ready.gov/sites/default/files/2021-11/are-you-ready-guide.pdf", file: fema-are-you-ready.pdf, cat: survival, tier: 1 }
  - { title: "Emergency War Surgery, 5th US revision (Borden Institute)", page: "https://medcoe.army.mil/borden-tb-ews", folder: emergency-war-surgery, cat: medical, tier: 1 }

manual:
  # Free, but behind landing pages or split into chapters that move around.
  - { title: "Where There Is No Doctor; Where There Is No Dentist; Where Women Have No Doctor; A Book for Midwives (Hesperian)", where: "hesperian.org - free PDF downloads", cat: medical }
  - { title: "Where There Is No Animal Doctor", where: "search the title; distributed free by Christian Veterinary Mission", cat: food }
  - { title: "TCCC guidelines + All Service Members card", where: "deployedmedicine.com", cat: medical }
  - { title: "Stop the Bleed booklet", where: "stopthebleed.org", cat: medical }
  - { title: "Special Operations Forces Medical Handbook / Ranger Medic Handbook", where: "public PDFs; search the titles", cat: medical }
  - { title: "The Ship Captain's Medical Guide", where: "gov.uk (Maritime and Coastguard Agency)", cat: medical }
  - { title: "WHO Model Formulary + Essential Medicines List", where: "who.int (IRIS repository)", cat: medical }
  - { title: "USDA Complete Guide to Home Canning (2015)", where: "nchfp.uga.edu", cat: food }
  - { title: "So Easy to Preserve - excerpts + NCHFP fact sheets", where: "nchfp.uga.edu", cat: food }
  - { title: "State extension service: vegetable garden calendar, livestock, food preservation", where: "your state's land-grant university extension site", cat: food }
  - { title: "FAO technical manuals (small-scale farming, fish ponds, food storage)", where: "fao.org/documents", cat: food }
  - { title: "CERT Basic Training participant manual", where: "fema.gov/emergency-managers/individuals-communities/cert", cat: survival }
  - { title: "Manuals for every firearm, radio, generator, vehicle and appliance you own", where: "manufacturer sites", cat: defense }
  - { title: "ARRL band plan, ICS-213/ICS-214 forms, local repeater list, ARES/RACES plan", where: "arrl.org, your county ARES", cat: comms }
  - { title: "USGS topo maps (GeoPDF) for your county", where: "ngmdb.usgs.gov/topoview", cat: survival }
  - { title: "Purchased books (ARRL Handbook, Foxfire, Machinery's Handbook, ...)", where: "your own copies, into /srv/library/personal", cat: personal }

phone_apps:
  # Into /srv/core/share/apps so phones can install them from the portal with no internet.
  - { title: Kiwix (Android), where: "download.kiwix.org/release/kiwix-android/" }
  - { title: Organic Maps (Android) + offline map files, where: "github.com/organicmaps/organicmaps/releases" }
  - { title: MeshCore companion app (Android), where: "meshcore.co.uk" }
  - { title: F-Droid (Android app store; for further offline APKs), where: "f-droid.org" }
