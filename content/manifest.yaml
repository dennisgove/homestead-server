# Content to pull while the internet is up:  sudo scripts/fetch_content.py --tier 1
#
# zims:   kiwix: <dir>/<name>  -> newest <name>_YYYY-MM.zim under download.kiwix.org/zim/<dir>/
#         target: core     -> /srv/core/zim on the NVMe (essentials; works without the USB drive)
#                 library  -> NOMAD's zim folder on the LIBRARY drive (skipped if NOMAD already has it)
# docs:   PDFs into /srv/core/docs/<cat>/ (listed on the portal, fed to the AI knowledge bases)
#         url: a single file    page: every PDF linked from that page
# manual: no stable direct link; get these by hand into /srv/core/docs/<cat>/
#
# tier 1 = critical (medical, water, food, defense), 2 = sustainability & repair, 3 = education & culture.
# Rough sizes are from the Kiwix mirror in Oct 2026; the script prints exact sizes before downloading.
# NOMAD's Command Center has its own curated collections (Medicine, Survival, Agriculture, DIY,
# Education, Wikipedia). Install those from its setup wizard too; this list fills the gaps.

zims:
  # --- Tier 1: core (NVMe) ------------------------------------------------
  - { kiwix: other/zimgit-medicine_en,          target: core, tier: 1, cat: medical }      # field & emergency medicine books
  - { kiwix: other/zimgit-water_en,             target: core, tier: 1, cat: water }
  - { kiwix: other/zimgit-food-preparation_en,  target: core, tier: 1, cat: food }
  - { kiwix: other/zimgit-post-disaster_en,     target: core, tier: 1, cat: survival }
  - { kiwix: other/zimgit-knots_en,             target: core, tier: 1, cat: survival }
  - { kiwix: other/mdwiki_en_all_maxi,          target: core, tier: 1, cat: medical }      # WikiProject Medicine (WikiMed)
  - { kiwix: other/wikem_en_all_maxi,           target: core, tier: 1, cat: medical }      # emergency medicine
  - { kiwix: wikipedia/wikipedia_en_medicine_maxi, target: core, tier: 1, cat: medical }
  - { kiwix: zimit/fas-military-medicine_en,    target: core, tier: 1, cat: medical }
  - { kiwix: zimit/irp.fas.org_en_military-medicine, target: core, tier: 1, cat: medical }
  - { kiwix: zimit/nhs.uk_en_medicines,         target: core, tier: 1, cat: medical }      # drug A-Z, doses, interactions
  - { kiwix: zimit/wwwnc.cdc.gov_en_all,        target: core, tier: 1, cat: medical }      # CDC travel/infectious disease
  - { kiwix: other/wikivet.net_en_all_maxi,     target: core, tier: 1, cat: food }         # veterinary medicine for livestock
  - { kiwix: zimit/armypubs_en_all,             target: core, tier: 1, cat: defense }      # US Army field manuals (~7GB)
  - { kiwix: zimit/www.ready.gov_en,            target: core, tier: 1, cat: survival }
  - { kiwix: other/trueprepper.com_en_all,      target: core, tier: 1, cat: survival }
