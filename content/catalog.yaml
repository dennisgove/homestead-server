# Homestead content catalog: the baseline of everything the library should hold.
# The Library manager (Hub, /library) adds, removes and changes items on top of
# this; those edits live in /var/lib/homestead/catalog.local.yaml (backed up),
# and its Export button turns them into a patch for this file.
#
# item fields
#   id        unique, stable
#   type      zim      Kiwix archive; `name` is its name on library.kiwix.org (newest release is used)
#             doc      one file from `url`, saved as `file`
#             docpage  every PDF linked from `page` (only links matching `match`), into `folder`
#             kolibri  a Kolibri channel (`channel` id), imported into Kolibri
#   category  one of `categories` below (folder name under docs/, AI knowledge base, portal section)
#   tier      1 critical, 2 sustainability & repair, 3 education & culture (content_tier picks how far to go)
#   disk      core (NVMe essentials, works without the USB drive) | library (USB drive). Docs are always core.
#   ai        load into the AI's knowledge bases (docs)          binder   list in the printed binder
#   update    false = keep the release we have (default: take newer releases)

version: 1
categories:
  medical: Medical
  water: Water & sanitation
  food: Food, garden & livestock
  defense: Defense & security
  survival: Survival & shelter
  power: Power & energy
  repair: Repair & building
  comms: Radio & comms
  education: Education
  reference: Reference
  personal: Our own documents
