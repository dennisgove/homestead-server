# The Homestead library: everything the website offers, by topic.
#
# Each topic lists its items. An item is one of:
#   zim: <name>          an encyclopedia or website from Kiwix's catalog (newest release is fetched)
#   pdf: <url>           one document            epub: <url>   one ebook
#   book: <page url>     a book published as one PDF per chapter: every PDF linked from the page
#                        (only links matching `match:`, a regular expression). Chapter titles are
#                        read from each chapter's first page.
#   course: <channel>    a Khan Academy-style course channel (Kolibri Studio channel id)
# Options:
#   title:      what the website calls it (zim: taken from the file itself if left out)
#   essential:  true = stored on the internal disk, so it works even without the USB library drive
#   print:      true = goes in the printed binder
#   priority:   1 (default) fetched first ... 3 fetched last, and only if there's room
#
# Add or remove things here, or with `homestead add` / `homestead remove` on the server
# (those changes are kept in /var/lib/homestead/library/changes.yaml and survive updates).

topics:

