# The printed binders: what to keep on paper if this computer fails. Half-inch ring binders, each about
# 100 sheets (200 pages printed on both sides), similar things together. The website's Binder page lists
# them in order and links each entry to the print form with these chapters or pages already picked.
#   binder:   one binder: its name, colour (for the spine label) and contents
#   group:    the shelf it goes with ("Emergency medical", ...): on the website, binders of one group sit under one heading
#   note:     what's in it, for its cover; how: how to print it (shown on the website, not the cover)
#   section:  a tab divider inside the binder, before this entry and those after it
#   doc:      a document's title, as in the topics above
#   chapters: for a book printed chapter by chapter, which ones (as the website labels them: "Chapter 10", "Guide 1", ...)
#   pages:    which pages, like "57-106" or "21-25, 65-70" (counted through the chapters picked, for a book)
#   what:     what that part is; why: why it's worth paper
#   first:    true = print this before the rest
#   color:    true = print in colour (photos, coloured diagrams)
#   folder:   instead of doc: every PDF in that folder of the documents, whole, by subfolder
#             (files: only names starting with these; first_files: those that go in the first round)
# Documents marked print: true that aren't listed here show up at the end.
binders:
  - binder: "First aid and injuries"
    group: "Emergency medical"
    color: "red"
    note: "Emergencies: bleeding, breathing, shock, burns, broken bones, wounds, heat and cold."
    items:
      - doc: "Stop the Bleed: Save a Life booklet (American College of Surgeons)"
        section: "Bleeding and the order to treat"
        why: "Tourniquet and wound packing, step by step with pictures."
        first: true
        color: true
      - doc: "ATP 4-02.11: Casualty Response, Tactical Combat Casualty Care, and First Aid (US Army)"
        pages: "57-106"
        what: "Bleeding, airway, breathing, shock and hypothermia: the order to treat in (chapters 4 to 8)"
        first: true
      - doc: "ATP 4-02.11: Casualty Response, Tactical Combat Casualty Care, and First Aid (US Army)"
        section: "Burns, fractures, wounds"
        pages: "129-164"
        what: "Burns, broken bones and splints, bandaging (chapters 12 to 14)"
        first: true
      - doc: "Clinical Guidelines: Diagnosis and Treatment Manual (MSF)"
        pages: "325-375"
        what: "Dressings, cleaning and closing wounds, burns, abscesses, minor procedures (chapter 10)"
      - doc: "ATP 4-02.11: Casualty Response, Tactical Combat Casualty Care, and First Aid (US Army)"
        section: "Bites, heat and cold"
        pages: "173-198"
        what: "Bites and stings, heat and cold injuries (chapters 16 and 17)"
      - doc: "TB MED 507: Heat Stress Control and Heat Casualty Management (US Army)"
        pages: "69-72"
        what: "A one-sheet guide to preventing heat illness"
      - doc: "TB MED 508: Prevention and Management of Cold-Weather Injuries (US Army)"
        pages: "113-115"
        what: "Cold-weather tips and first aid for frostbite and hypothermia"

  - binder: "Sickness and medicines"
    group: "Long-term medical"
    color: "red"
    note: "Finding out what's wrong, the common sicknesses, and every common medicine with its doses."
    items:
      - doc: "Where There Is No Doctor (Hesperian)"
        section: "Sickness"
        chapters: ["Chapter 3", "Chapter 10", "Chapter 13"]
        what: "Examining a sick person, first aid, the most common sicknesses (dehydration, fever, diarrhea, worms)"
        first: true
      - doc: "Where There Is No Doctor (Hesperian)"
        section: "Medicines"
        chapters: ["Chapter 8", "Chapter 23", "Medicines pages"]
        what: "Measuring and giving medicine, the home medicine kit, and the Green Pages: every common medicine with its doses"
        first: true

  - binder: "Childbirth, children and teeth"
    group: "Long-term medical"
    color: "red"
    note: "Family health: having a baby, a seriously sick child, toothache."
    items:
      - doc: "Where There Is No Doctor (Hesperian)"
        section: "Childbirth"
        chapters: ["Chapter 19"]
        what: "Pregnancy and childbirth for whoever has to help"
      - doc: "WHO Managing Complications in Pregnancy and Childbirth (2017)"
        pages: "173-192"
        what: "Heavy bleeding after childbirth, the most common way a birth goes wrong"
      - doc: "Pocket Book of Hospital Care for Children (WHO, 2005)"
        section: "Children"
        pages: "21-56, 129-152"
        what: "A seriously sick child: emergency signs and what to do (chapter 1); diarrhea and dehydration (chapter 5)"
      - doc: "Where There Is No Dentist (Hesperian)"
        section: "Teeth"
        chapters: ["Chapter 7", "Chapter 11"]
        what: "Toothache, abscesses and other common problems; taking out a tooth"

  - binder: "Stress and coping"
    group: "Long-term medical"
    color: "red"
    note: "Helping people through it: stress, shock and grief, and children of every age."
    items:
      - doc: "Tips for Survivors of a Disaster: Managing Stress (SAMHSA)"
        section: "Stress"
        first: true
      - doc: "Psychological First Aid: Guide for Field Workers (WHO, 2011)"
        pages: "20-43"
        what: "How to help someone in shock or distress: look, listen, link (chapter 3)"
      - doc: "Doing What Matters in Times of Stress: an illustrated guide (WHO, 2020)"
        pages: "1-53"
        what: "Stress and grounding: the first part of WHO's illustrated self-help guide"
        color: true
      - doc: "Parent Tips: Infants and Toddlers after Disasters (NCTSN)"
