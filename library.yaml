  - { title: "Manuals for every firearm, radio, generator, vehicle and appliance you own", where: "manufacturer sites" }
  - { title: "Local repeater list, ARES/RACES plan", where: "your county ARES / RepeaterBook" }
  - { title: "USGS topo maps (GeoPDF) for your county", where: "ngmdb.usgs.gov/topoview" }
  - { title: "Purchased books (ARRL Handbook, Foxfire, Machinery's Handbook, ...)", where: "your own copies, into /srv/library/personal" }

