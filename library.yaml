# Things to get by hand (no free download). The website lists them on the Status page.
by_hand:
  - { title: "Where There Is No Animal Doctor", where: "buy from store.hesperian.org (WikiVet and FAO poultry are in the library meanwhile)" }
  - { title: "TCCC guidelines + All Service Members card", where: "Deployed Medicine app/site (ATP 4-02.11 in the library covers TCCC and first aid)" }
  - { title: "Where There Is No Psychiatrist, 2nd ed. (Patel and Hanlon)", where: "buy from Cambridge University Press (WHO and NCTSN psychological first aid guides are in the library meanwhile)" }
  - { title: "The Ship Captain's Medical Guide, 24th ed.", where: "sold by TSO/MCA, no free copy (the SOF and Special Forces medical handbooks cover similar ground)" }
  - { title: "So Easy to Preserve", where: "buy from the University of Georgia (the USDA canning guide is in the library)" }
